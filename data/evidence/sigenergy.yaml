# Evidence layer — see the rule below. URLs are the makers' own. Documents with an id in tools/evidence/sources.yaml
# are written by tools/evidence/build.py from the maker's file; the others were transcribed by hand. Do not edit the
# generated ones here: change the mapping in sources.yaml and rebuild.
brand: Sigenergy
maker_site: ''
rule: 'Facts transcribed from the maker''s own document on the seen date: a released-countries table (an X per family and country),
  the list of country / grid-code settings in the firmware, or a certificate / test-lab declaration against the named standard, with
  the models it lists. GridFit shows it as "fit by the maker''s document" in that country; the grid operator decides at the application,
  and where a country has a public list the list is the answer. Model codes are joined by `match`, a regex over the register code (upper
  case, spaces removed, comma read as a point).'
documents:
- id: it-cei021-sigen-tp-2024
  title: Intertek Certificate of Conformity CN-PVES-240079 — CEI 0-21:2022-03 + V1:2022-11 — SigenStor EC / SigenStor AC / Sigen Hybrid
    / Sigen PV Max x TP (5.0–30.0) with SigenStor BAT 5.0 / 8.0
  url: https://wwwstatic.sigenergy.com/content/assets/uploads/en_download/1711705966851684.pdf
  issuer: Intertek Testing Services Ltd. Shanghai (ACCREDIA, ISO/IEC 17065); tests Intertek Testing Services Shenzhen Ltd. Guangzhou
    Branch (IAS TL-395), report 230705121GZU-001
  cert_no: CN-PVES-240079
  issued: '2024-03-08'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  firmware: V100R001C21
  families:
  - name: SigenStor EC/AC, Sigen Hybrid, Sigen PV Max three-phase 5–30 kW
    match: ^(SIGEN)?(STOR(EC|AC)|HYBRID(INVERTER)?|PVMAX|(EC)?ENERGYCONTROLLER)(5\.0|6\.0|8\.0|10\.0|12\.0|15\.0|17\.0|20\.0|25\.0|30\.0)TP$
    countries: [IT]
    note: Batteries SigenStor BAT 5.0 / 8.0 (1–6 modules), control model SES1PWR3 VB. Register aliases "Sigen Energy Controller" (=
      the SigenStor EC unit) and "Sigen Hybrid Inverter" joined; -LV, -BE and TP2 variants are not named.
- id: it-cei021-sigen-sp-2023
  title: TÜV SÜD Compliance Document D 121007 0005 Rev. 00 — CEI 0-21:2022/V1:2022 — SigenStor EC / SigenStor AC / Sigen Hybrid 3.0–6.0
    SP with SigenStor BAT 5.0 / 8.0
  url: https://wwwstatic.sigenergy.com/content/assets/uploads/en_download/1709100813462307.pdf
  issuer: TÜV SÜD Product Service GmbH (Munich), report 5040923022421-00
  cert_no: D 121007 0005 Rev. 00
  issued: '2023-08-07'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022/V1:2022
  families:
  - name: SigenStor EC/AC and Sigen Hybrid single-phase 3–6 kW
    match: ^SIGEN(STOR(EC|AC)|HYBRID(INVERTER)?|ENERGYCONTROLLER)(3\.0|3\.6|4\.0|4\.6|5\.0|6\.0)SP$
    countries: [IT]
    note: Product named "Sigen Energy controller" on the certificate (= SigenStor EC). Batteries SigenStor BAT 5.0 / 8.0 (1–6 pieces).
      The PDF on the site is the 2-page excerpt (pages 1–2 of 6); an Italian copy is at …/1709100854453665.pdf. SP2 and Neo not named.
- id: it-cei021-sigen-pv-max-sp-2023
  title: TÜV SÜD Compliance Document D 121007 0009 Rev. 00 — CEI 0-21:2022/V1:2022 — Sigen PV Max 3.0–6.0 SP
  url: https://wwwstatic.sigenergy.com/content/assets/uploads/en_download/1709100685556803.pdf
  issuer: TÜV SÜD Product Service GmbH (Munich), report 5040923022424-00
  cert_no: D 121007 0009 Rev. 00
  issued: '2023-09-08'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022/V1:2022
  families:
  - name: Sigen PV Max single-phase string 3–6 kW
    match: ^SIGENPVMAX(3\.0|3\.6|4\.0|4\.6|5\.0|6\.0)SP$
    countries: [IT]
    note: 2-page excerpt of a 4-page document on the site; Italian copy at …/1709100728571692.pdf.
