  issued: '2024-12-06'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  firmware: V02
  families:
  - name: Single-phase LV hybrid SL / SLP / ASL 1–6 kW
    match: ^(HYBRIDINVERTER)?AF((1|1\.5|2|2\.5|3|3\.6)K-A?SL-1|(3|3\.6|4|4\.6|5|5\.5|6)K-A?SL|(1|1\.5|2|2\.5|3|3\.6|4|4\.6|5|5\.5|6)K-A?SL-0|(4|4\.6|5|5\.5|6)K-SLP)$
    countries: [IT]
    note: 'DEKRA file 6211760.50; tested with Lithium Valley LV-BST-L5.12Aa (-01, -02, Pro) / S5000, 1–8 in parallel; expires 2029-12-06.
      Annex table: static conversion, interface protection and interface device Yes (SPI integrated); page 1 also states "suitable for
      installation in systems with a total power greater than 11.08 kW". DEKRA issues one certificate per inverter + battery pairing;
      the same SL models are on 6204154.01COC (Daybright LW5000, V2, 2024-11-20) and on 13 older CEI 0-21:2022-03 base-edition certificates
      on aforenergy.com (Pytes, Shoto, YelonESS, Solareast, Kseng, Ruidian, LFPWall, Soluna, BST W5.12AC / W10.24AC, AF5000W-LF, AF10000W-LG).
      Register rows written "Hybrid inverter AF…-SL" are joined.'
