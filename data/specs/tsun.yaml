brand: TSUN
maker_site: https://www.tsun-ess.com/
rule: 'Every number is the maker''s own datasheet as read on the seen date: MPPT count, rated AC power (kW; kVA where the
  sheet gives apparent power), max AC output current (A), phases (from the AC connection row), max PV input (kW). A model
  code is matched to the lists exactly (upper case, spaces removed, comma as decimal point), or by `match` where the lists
  spell the same hardware differently. A value the sheet does not state is null and shows as ''not collected''. Hardware revisions
  with another suffix are other models.'
# Written by hand 2026-11-12 (Belgium's coverage pass, docs/coverage/be.md) from the sheets on www.tsun-ess.com/downloads.html,
# each table read off the rendered page (the text layer shifts the labels by a row). The sheets carry no version; `version`
# is the server's Last-Modified date. "Balcony" in a list's code is the same unit with the trunk / balcony cable (the sheet
# gives a weight for it); "-B1" … "-B4" on an MSU2000 is the unit with one to four B2000 stackable batteries (the sheet's
# "1 MSU + 4 stackable battery"). Not covered: MX800Lite, MS3000, MSU1000, MAU1000 / MAU2000, ACU / HSU, MP2250 / MP3000
# and the ESK kits — no sheet for them on the download page on 2026-11-12.
