# After every push to main: build the site and update the sitemap's true lastmod (tools/sitemap/lastmod.py), so a
# merged change gets its date the same day instead of at the next weekly refresh. Commits only data/sitemap/lastmod.json;
# a push made with the workflow token starts no workflow, so this never loops, and its push triggers the Pages build
# that publishes the new dates.
name: lastmod
on:
  push:
    branches: [main]
    paths-ignore:
      - data/sitemap/lastmod.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lastmod
  cancel-in-progress: true
jobs:
  lastmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: build the site
        env:
          GRIDFIT_BASE_URL: https://gridfit.eu
        run: cd web && npm ci && npm run build
      - name: update lastmod and commit it when a page changed
        run: |
          python tools/sitemap/lastmod.py web/dist
          git add data/sitemap/lastmod.json
          if git diff --cached --quiet; then echo "no page changed"; exit 0; fi
          git config user.name "gridfit-bot"
          git config user.email "gridfit-bot@users.noreply.github.com"
          git commit -m "sitemap: lastmod $(date -u +%F)"
          git pull --rebase origin main
          git push
