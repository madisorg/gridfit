    match: ^((SUNNYTRIPOWER)?(STP)?(3\.0|4\.0|5\.0|6\.0|8\.0|10\.0)-3AV-40|(SUNNYTRIPOWER|CORE1/)?STP50-4[01]|(SUNNYTRIPOWER)?(STP)?(12|15|20|25)-50)$
    countries: [SE]
    note: 'Maker''s parameter list, not a certificate: country data set [EU] EN50549-1:2018 LV, then default → value to set (HzOv 50.2
      → 50.5 Hz, gradient 40 → 25 %/Hz, reconnection times 60 → 180 s, hhLim 1.15 pu 200 ms, hLim 1.10 pu 60 000 ms, lLim 0.85 pu 200
      ms, connection 47.5–50.1 Hz, islanding trip 500 ms). The document prints no date; issued = the PDF''s creation date. The PDF keywords
