- id: es-nts-ktlx-g3-3-12-2022
  title: SGS Tecnos 2621/0147-1-CER — NTS 2.1 + Corrección 1.0, Type A — SOFAR 3.3…12KTLX-G3 (+ -A)
  url: https://www.sofarsolar.com/upload/file/20240205/1707126821856084687.pdf
  issuer: SGS Tecnos, S.A.
