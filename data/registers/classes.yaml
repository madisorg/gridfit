# Register devices that are not inverters, batteries or wallboxes: class `other` (CHP, wind, generators), which the site
# does not show (gridfit/registers.py PAGE_CLASSES). Two lists put such units into an inverter or battery class: Belgium's
# C10/26 flags "Backup power system" (generator sets) and tools/registers/parse.py read that flag as storage until
# 2026-11-12; the Netherlands' POWER_GENERATING file lists every generating unit in one sheet with no type column.
#
# `makers` is derived, not chosen: a register maker every one of whose Belgian rows (the power-generating-units and the
# expired-homologations sheets) carries no Solar energy or Energy storage flag — only CHP, Wind or Backup power system —
# and that has no inverter, battery or wallbox entry on the AT, CZ, EE, PL or SE lists. Read 2026-11-12 from the
# C10/26 file dated 2026-10-30 (the same edition as the 2026-11-01 snapshot). The flags of each maker's rows follow it.
# `also` and `models` are by hand, each with its reason. Read by gridfit/registers.py _class.
source: "Synergrid C10/26 list of power-generating units, file dated 2026-10-30, columns Solar energy / Wind energy / CHP / Energy storage / Backup power system"
source_url: https://www.synergrid.be/images/downloads/c10_26_list_of_pgu_compliant_with_c10_11_ed2_1_12_2019.xlsx
read: "2026-11-12"
