      note: "Kostal declaration (38 pages, scanned) plus the Kiwa certificate and annex. SPI integrated; Kiwa ticks \"idoneo per impianti > 11,08 kW\". Batteries listed are KOSTAL HELIVOR HV (ZYC), AXITEC AXIstorage Li SV1/SV2, BYD and others. Base power can be raised by a software power extension; the certificate lists the maximum per size. Published 2026-05-27, replacing doc 2286 (2025-07-21)."
  - id: cei021-plenticore-mp-g3-2026
    title: "Dichiarazione di conformità + Kiwa certificato 25-205-03 — CEI 0-21 (to V2/EC2:2025-02) — PLENTICORE MP S/M G3 3.0…7.0 con sistemi a batteria"
    url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Zertifikate-Herstellererklaerungen/2302_Z_PLENTICORE_MP_G3_CEI_0-21_it.pdf
    issuer: Kiwa Primara GmbH (DAkkS D-ZE-12089-01-00, DIN EN ISO/IEC 17065)
    cert_no: 25-205-03
    issued: '2026-05-07'
    seen: '2026-10-31'
    kind: certificate
    standards:
    - CEI 0-21:2022-03
    - CEI 0-21;V1:2022-11
    - CEI 0-21;V2:2024-01
    - CEI 0-21;V2/EC:2024-03
    - CEI 0-21;V2/EC2:2025-02
    firmware: SW ≥ 3.06.10
    families:
    - name: PLENTICORE MP S G3 3.0/3.6/4.0, MP M G3 5.0/6.0/7.0 (single-phase hybrid)
      match: '^PLENTICOREMP[SM]?G3'
      countries:
      - IT
      note: "SPI integrated. The two layers disagree on the 11.08 kW line. Kostal's own page 1 note reads \"Installabile su impianti di Potenza <= 11,08kW\", but Kiwa's annex ticks \"idoneo per installazione in impianti con potenza superiore a 11,08 kW\". Kostal lists Pn of 7.0 as 5.4 kVA (6.0 kVA Sn)."
