- id: se-eifs-setup-sweden-2020
  title: Fronius "Conformity to EN 50549-1 with Setup Sweden" — EN 50549-1, EIFS 2018:2 — Primo, Symo, Symo Hybrid, Eco, Symo GEN24
  url: https://assets.ctfassets.net/9pi13bto1z9e/6oUE8zOD4pYZaC6NYiK1ry/39fa760edd4cf822fa32d0e6fc45be8d/202065_SE_CER_Conformity_EN50549_Sweden_EN.PDF
  copy_of: assets.ctfassets.net (Contentful CDN) — not confirmed as Fronius's own asset store; no fronius.com URL found
  issuer: Fronius International GmbH (maker's declaration)
  doc_no: SE_CER_Conformity_EN50549_Sweden
  issued: '2020-09-29'
  seen: '2026-11-01'
  kind: declaration
  standards:
  - EN 50549-1
  - EIFS 2018:2
  - IEC 62116
  families:
  - name: Primo (SnapINverter, single-phase)
    match: ^PRIMO\d+\.\d-1$
    countries: [SE]
  - name: Symo (SnapINverter, three-phase)
    match: ^(FRONIUS)?SYMO\d+\.\d-3-(M|S)(-OS|LIGHT)?$
    countries: [SE]
    note: Symo Advanced is not named and is not joined.
  - name: Symo Hybrid
    match: ^SYMOHYBRID(3|4|5)\.0-3-S$
    countries: [SE]
  - name: Eco
    match: ^ECO(25|27)\.0-3-S(LIGHT|WLAN/LAN/WEBOVÝSERVER)?$
    countries: [SE]
  - name: Symo GEN24 (Plus)
    match: ^SYMOGEN24(PLUS)?\d+\.0(PLUS)?$
    countries: [SE]
    note: Family names only in the declaration, no model list or firmware. The 2020 document predates the Symo GEN24 SC models, which
      are not joined. "Setup Sweden" settings table with numbers (U> 255.3 V 60 s, U>> 264.5 V 0.2 s, U< 195.5 V 0.2 s, f> 51.5 / f<
      47.5 Hz 0.1 s, LFSM-O 50.5 Hz / 8 %, reconnection 47.5–50.1 Hz after 180 s) — documented for the 2020 Swedish setup, before the
      ALP 2025 form (0.5 s frequency trips).
