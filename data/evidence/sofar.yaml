# Evidence layer — see the rule below. URLs are the makers' own. Documents with an id in tools/evidence/sources.yaml
# are written by tools/evidence/build.py from the maker's file; the others were transcribed by hand. Do not edit the
# generated ones here: change the mapping in sources.yaml and rebuild.
brand: Sofar
maker_site: ''
rule: 'Facts transcribed from the maker''s own document on the seen date: a released-countries table (an X per family and country),
  the list of country / grid-code settings in the firmware, or a certificate / test-lab declaration against the named standard, with
  the models it lists. GridFit shows it as "fit by the maker''s document" in that country; the grid operator decides at the application,
  and where a country has a public list the list is the answer. Model codes are joined by `match`, a regex over the register code (upper
  case, spaces removed, comma read as a point).'
documents:
- id: hyd-3ph-manual-country-codes
  title: HYD 5–20KTL-3PH user manual — Setting the country code
  url: https://www.sofarsolar.com/upload/file/20240321/1710982866939025487.pdf
  kind: grid-code-setting
  note: The manual's country-code table (109-000 Estonia, 122-000 Latvia, 108-000 Lithuania, 125-000 Finland). The same code system
    as ZCS Azzurro's table; Sofar's other manuals sit in a JavaScript download centre and were not found elsewhere.
  seen: '2026-11-01'
  source: tools/evidence
  families:
  - name: HYD 5–20KTL-3PH
    match: ^(SOFAR)?HYD-?(5|6|8|10|15|20)KTL-3PH
    countries: [AT, BE, CH, CY, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, IE, IT, LT, LV, NL, 'NO', PL, RO, SE, SI, SK, TR, UA]
- id: es-nts-ktlx-g3-3-12-2022
  title: SGS Tecnos 2621/0147-1-CER — NTS 2.1 + Corrección 1.0, Type A — SOFAR 3.3…12KTLX-G3 (+ -A)
  url: https://www.sofarsolar.com/upload/file/20240205/1707126821856084687.pdf
  issuer: SGS Tecnos, S.A.
  cert_no: 2621/0147-1-CER
  issued: '2022-03-01'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - NTS Revisión 2.1 del 9 de julio de 2021
  - Corrección de errores de la versión 2.1, Revisión 1.0 del 8 de octubre de 2021
  firmware: V000001
  families:
  - name: SOFAR KTLX-G3 three-phase string 3.3–12 kW
    match: ^(SOFAR)?((3\.3|4\.4|5\.5|6\.6|8\.8|11|12)KTLX-G3|(5|8\.8|10|11)KTLX-G3-A)(-GRIDCONNECTEDPHOTOVOLTAICINVERTER|-SOLARGRID-TIEDINVERTER)?$
    countries:
    - ES
    note: Type A. The register writes the same models with and without the "SOFAR" prefix and some with the product description glued
      on ("-GRIDCONNECTEDPHOTOVOLTAICINVERTER"); the regex takes those spellings. Garbled codes ("SOFAR3.3LKTLX-G3.-…", "SOFAR5KTLX-G3-A-3-…")
      are not taken.
- id: es-nts-ktlx-g3-15-24-2022
  title: SGS Tecnos 2622/0142-1-CER — NTS 2.1 + Corrección 1.0, Type A — SOFAR 15…24KTLX-G3 (+ -A)
  url: https://www.sofarsolar.com/upload/file/20240205/1707126929015055973.pdf
  issuer: SGS Tecnos, S.A.
  cert_no: 2622/0142-1-CER
  issued: '2022-03-28'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - NTS Revisión 2.1 del 9 de julio de 2021
  - Corrección de errores de la versión 2.1, Revisión 1.0 del 8 de octubre de 2021
  firmware: V010000
  families:
  - name: SOFAR KTLX-G3 three-phase string 15–24 kW
    match: ^(SOFAR)?((15|17|20|22|24)K(TLX|LTX)-G3|(15|20|24)KTLX-G3-A)(-GRIDCONNECTEDPHOTOVOLTAICINVERTER|-SOLARGRID-TIEDINVERTER)?$
    countries:
    - ES
    note: Type A. Lists 15, 15-A, 17, 20, 20-A, 22, 24, 24-A. The regex also takes the register's "KLTX" misspelling and prefix/description
      variants of the same models. Not the newer KTLX-G3P series (different product).
