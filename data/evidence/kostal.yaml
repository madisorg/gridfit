  url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Zertifikate-Herstellererklaerungen/1978_Z-VDE-AR-N-4105-2018-Einheitenzertifikat_PLENTICORE-plus-G2_de.pdf
  issuer: Bureau Veritas Consumer Products Services Germany GmbH (ISO/IEC 17065)
  cert_no: U22-0449
  issued: '2022-08-10'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - VDE-AR-N 4105:2018-11
  - DIN VDE V 0124-100 (VDE V 0124-100):2020-06
  firmware: '02.04'
  families:
  - name: PLENTICORE plus G2 3.0/4.2/5.5/7.0/8.5/10
    match: ^PLENTICORE(PLUS(3\.0|4\.2|5\.5|7\.0|8\.5|10)G2|PLUSG2(3\.0|4\.2|5\.5|7\.0|8\.5|10))$
    countries:
