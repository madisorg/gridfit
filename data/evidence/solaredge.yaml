- id: it-cei021-hd-wave-storedge-1ph-2023
  title: Dichiarazione di conformità alle prescrizioni alla Norma CEI 0-21 — CEI 0-21:2022-03 + V1:2022-11 — single-phase HD-Wave SE2200H-SE6000H
    with StorEdge connection unit
  url: https://knowledge-center.solaredge.com/sites/kc/files/se-single-phase-and-storedge-inverters-cei-0-21-certificate-it.pdf
  issuer: Kiwa Primara GmbH, DAkkS D-ZE-12089-01-00 (programme SOP-9-1_15 GCC, 09/21)
  cert_no: 23-287-01
  issued: '2023-09-04'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  firmware: 'DSP1: 1.0.xxxx / DSP2: 2.0.xxxx; DSP1: 1.100.xxxx / DSP2: 2.100.xxxx'
  families:
  - name: SolarEdge HD-Wave 2.2-6 kW 1-phase (SExxxxH, also with StorEdge SESTI)
