  url: https://www.memodo.cz/mwdownloads/a3d0b5506e685b28ae076355e6976d33
  copy_of: memodo.cz (Czech distributor); not found on solaxpower.com
  issuer: SolaX Power Network Technology (Zhejiang) Co., Ltd. (maker's declaration)
  issued: '2022-12-20'
  seen: '2026-11-01'
  kind: declaration
