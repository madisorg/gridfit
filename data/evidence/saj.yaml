- id: it-cei021-hs3-s2-2025
  title: TÜV Rheinland Certificate of Conformity A3 50668152 0001-0002 with Dichiarazione di conformità — CEI 0-21:2022-03 + V1 + V2:2024-01
    — HS3-3K…6K-S2 all-in-one energy storage system
  url: https://www.saj-electric.com/hubfs/South%20East%20Europe%20document/Certification/Italy%20certification/HS3/HS3-(3-6K)-S2%20Series%20Single-phase%20CEI%200-21%20Certificate-ITA.pdf
  issuer: TÜV Rheinland LGA Products GmbH (DAkkS D-ZE-14169-01-02, ISO/IEC 17065)
  cert_no: A3 50668152 0001-0002
  issued: '2025-03-14'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  firmware: 'DSP: V1.100, MCU: V1.010'
  families:
  - name: HS3 S2 single-phase all-in-one hybrid 3–6 kW
    match: ^HS3-(3|3\.6|4|4\.6|5|6)K-S2-[WG]-[BP]X$|^HS3-5K-S2-[WG]-[BP]X-BE$|^HS3-6K-S2-[WG]-[BP]X-IE$
    countries: [IT]
    note: 'Test report CN24QPQM 002 (TÜV Rheinland Shanghai, CNAS L3038). W = Wi-Fi, G = 4G; B / P = battery variant; X = 1…8 battery
      modules BU3-5.0-TV2 (-BASE, -RPO, -PRO-BASE). Allegato ticks interface device, interface protection and static conversion: SPI
      integrated. Names the -BE (5K) and -IE (6K) variants. AS3 (AC-coupled) is not named.'
- id: it-cei021-hs3-t2-2025
  title: TÜV Rheinland Certificate of Conformity A3 50668151 0001-0002 with Dichiarazione di conformità — CEI 0-21:2022-03 + V1 + V2:2024-01
    — HS3-3K…12K-T2 all-in-one energy storage system
  url: https://www.saj-electric.com/hubfs/South%20East%20Europe%20document/Certification/Italy%20certification/HS3/HS3-(3-12K)-T2%20Series%20Three-phase%20CEI%200-21%20Certificate-ITA.pdf
  issuer: TÜV Rheinland LGA Products GmbH (DAkkS D-ZE-14169-01-02, ISO/IEC 17065)
  cert_no: A3 50668151 0001-0002
  issued: '2025-03-14'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  firmware: 'DSP: V1.010(U3), MCU: V2.010(U4)'
  families:
  - name: HS3 T2 three-phase all-in-one hybrid 3–12 kW
    match: ^HS3-(3|4|5|6|8|10|12)K-T2-[WG]-[BP]X(;HS3-(3|4|5|6|8|10|12)K-T2-G-[BP]X\(X=1\.2\.3\.4\.5\.6\.7\.8\))?$|^HS3-10K-T2-[WG]-[BP]X-BE(;HS3-10K-T2-G-[BP]X-BE\(X=1\.2\.3\.4\.5\.6\.7\.8\))?$|^HS3-12K-T2-[WG]-[BP]X-IE(;HS3-12K-T2-G-[BP]X-IE\(X=1\.2\.3\.4\.5\.6\.7\.8\))?$
    countries: [IT]
    note: 'Test report CN24M47K 002 (TÜV Rheinland Shanghai, CNAS L3038). X = 1…8 battery modules BU3-5.0-TV2 (-BASE, -RPO, -PRO-BASE);
      junction box BC3-TV above 3 modules. Allegato ticks interface device, interface protection and static conversion: SPI integrated.
      Page 1 misprints two names (HS3-3K-2-G-BX, HS3-5K-T2-BX); the Allegato tables (image pages) name every W/G × BX/PX code, -BE for
      10K and -IE for 12K. Combined register rows (W;G with X=1…8) are joined.'
