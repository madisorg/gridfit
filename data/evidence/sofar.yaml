    match: ^(SOFAR)?((3\.3|4\.4|5\.5|6\.6|8\.8|11|12)KTLX-G3|(5|8\.8|10|11)KTLX-G3-A)(-GRIDCONNECTEDPHOTOVOLTAICINVERTER|-SOLARGRID-TIEDINVERTER)?$
