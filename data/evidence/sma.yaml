  issuer: SMA declaration (Niestetal, 12.12.2023) + SGS Tecnos S.A.U. certificate
  cert_no: 2622/0215-C-E1-CER
  issued: '2023-10-27'
  valid_until: '2028-10-27'
  seen: '2026-10-31'
  kind: certificate
  standards:
  - CEI 0-21:2019-04 (Ed. 6 V1:2022-11), Allegato B
  - CEI 0-21:2022-03 and CEI 0-21;V1:2022-11 (SMA declaration wording)
  firmware: 01.16.03.R and higher
  families:
  - name: Sunny Tripower X
    match: ^(STP12\-50|STP15\-50|STP20\-50|STP25\-50)(-BE)?$
    countries: [IT]
