# Spain — requirement profile for a grid-connected inverter, battery or hybrid (type A, 0.8 kW to 100 kW).
# There is no public list. What the grid operator checks is the maker's equipment certificate, carried by the
# installer's own paperwork. Facts only, with the source of each; the grid operator decides. Written 2026-10-31
# from the BOE texts, REE's technical supervision standard and e-distribución's self-consumption guide.
cc: ES
country: Spain
type_a_max_kw: 100   # RD 647/2020 article 8.1: type A up to 100 kW; above it type B, a procedure of its own
not_listed_short: "the grid operator checks the maker's equipment certificate at the operational notification"
decided_by: "The distribution grid operator of the area (i-DE / Iberdrola, e-distribución / Endesa, UFD / Naturgy, E-Redes, Viesgo and some 300 small ones) at the operational notification; the regional authority (comunidad autónoma) registers the installation. Red Eléctrica (REE) writes the technical supervision standard (NTS) that says how conformity is proven."
basis:
  - "Commission Regulation (EU) 2016/631 (RfG), article 13 — type A requirements; article 30 — the installation document"
  - "Real Decreto 647/2020 (implements the connection network codes; thresholds in article 8; operational notification in article 9 and annex IV)"
  - "Orden TED/749/2020 (the technical requirements, annex I), as amended by Orden TED/1315/2022 (corrections) and Orden TED/82/2026 (fault ride-through for type A, storage, end of the self-consumption exemption; in force 12 May 2026)"
  - "Norma Técnica de Supervisión (NTS) version 2.1, July 2021 — how compliance is assessed; type A by equipment certificates (section 4.2.1)"
  - "Real Decreto 1699/2011 (small installations connected in low voltage: protections, article 14; three-phase above 15 kW, article 12.2)"
  - "Real Decreto 244/2019 (self-consumption: modalities, the anti-export device, exemption from access and connection permits, the register)"
  - "Reglamento electrotécnico para baja tensión (RD 842/2002), ITC-BT-40 (generating installations in low voltage; the anti-export device)"
# The edition every requirement below is written against, and what a maker's document must cite to count as
# evidence for it (tools/check/run.py; the schema is docs/checks.md). A certificate issued before Orden TED/82/2026
# is shown as "documented for" its date, with the items that order changed marked unverified.
edition:
  norm: "Orden TED/749/2020"
  id: "2026-05"
  date: "2026-05"
  in_force: "2026-05-12"
  label: "Orden TED/749/2020 as amended by Orden TED/82/2026 (in force 12 May 2026)"
document_must_cite: ["RD 647", "647/2020", "TED/749", "749/2020", "NTS", "Norma Técnica de Supervisión", "UNE 217002"]
accepts: [national-declaration]   # which kind of maker's document the operator takes (docs/checks.md)
must_meet:
  - id: power-class
    rule: "Plant size class (RD 647/2020, article 8.1)"
    value: "type A from 0.8 kW to 100 kW below 110 kV; above 100 kW type B, a procedure of its own with conformity per installation"
    check: { kind: max, meaning: rfg-type, field: ac_kw, limit: 100, over: "over 100 kW: type B, a procedure of its own", provable_by: [datasheet, document], source: "RD 647/2020 article 8.1" }
  - id: freq-range
    rule: "Frequency ranges (TED/749/2020 annex I, 1.1, table 1, peninsular Spain)"
    value: "47.5–48.5 Hz for 30 min; 48.5–51.0 Hz unlimited; 51.0–51.5 Hz for 30 min"
    check: { kind: range, field: freq_hz, range: [47.5, 51.5], provable_by: [datasheet, document], source: "Orden TED/749/2020 annex I, 1.1, table 1" }
  - id: rocof
    rule: "Rate of change of frequency (annex I, 1.2)"
    value: "stay connected up to 2 Hz/s measured over a 500 ms moving window; the operator may lower the value with the system operator's consent"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 1.2" }
  - id: lfsm-o
    rule: "Over-frequency response, LFSM-O (annex I, 1.3)"
    value: "active power reduction from 50.2 Hz (Δf = 0.2 Hz) with 5 % droop, unless the system operator says otherwise"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 1.3" }
  - id: auto-connection
    rule: "Automatic connection (annex I, 1.5)"
    value: "a settable frequency window within the ranges above and a power ramp-up limit; automatic connection is not the same as reconnection after a disturbance"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 1.5" }
  - id: frt
    rule: "Fault ride-through (annex I, 3.1.1 as amended 2026)"
    value: "since 12 May 2026 a type A power-park module (an inverter) below 110 kV rides through the figure 14 profile: 0.05 pu from the fault until 0.2 s, rising linearly to 0.85 pu at 1.5 s, 0.85 pu after that (GridFit's reading of the figure; the text gives no numbers); unbalanced faults by the lowest phase voltage; power electronics may block below 0.2 pu and must unblock within 100 ms above it; active power recovers as soon as possible once the voltage is back at 0.85 pu (3.3.1)"
    check: { kind: document, provable_by: [document], changed_in: "2026-05", changed: "Orden TED/82/2026 extends fault ride-through to type A", source: "Orden TED/749/2020 annex I, 3.1.1 and 3.3.1, as amended by Orden TED/82/2026" }
  - id: dc-injection
    rule: "DC injection (annex I, 5.3)"
    value: "a type A power-park module injects no more than 0.5 % of its rated current as direct current"
    check: { kind: max, field: idc_pct, limit: 0.5, over: "over 0.5 % of rated current", provable_by: [datasheet, document], source: "Orden TED/749/2020 annex I, 5.3" }
  - id: protection-settings
    rule: "Protection settings in low voltage (RD 1699/2011, article 14, table 1 — as the makers' Spanish declarations quote it)"
    value: "over-voltage 1.10 Un for 1.5 s and 1.15 Un for 0.2 s; under-voltage 0.85 Un for 1.5 s; over-frequency 51 Hz for 0.5 s; under-frequency 48 Hz for 3 s (47.5 Hz in the non-peninsular systems); after an over-frequency trip reconnect only once the frequency is at or below 50 Hz"
    check: { kind: document, provable_by: [document], source: "RD 1699/2011 article 14, table 1" }
  - id: anti-islanding
    rule: "Anti-islanding"
    value: "the installation must not keep voltage on a disconnected distribution line (RD 1699/2011, article 11.2); makers certify active anti-islanding to UNE-EN 62116 and inverter conformity to UNE 217002"
    check: { kind: document, provable_by: [document], source: "RD 1699/2011 article 11.2; UNE 217002; UNE-EN 62116" }
  - id: phases
    rule: "Phases (RD 1699/2011, article 12.2, as amended by RD 244/2019)"
    value: "above 15 kW the connection is three-phase with less than 5 kW imbalance between phases; a generator on an internal network behind a three-phase supply is three-phase too"
    check: { kind: phases, meaning: phases, three_phase_above_kw: 15, provable_by: [datasheet, document], source: "RD 1699/2011 article 12.2" }
  - id: anti-export
    rule: "Self-consumption without export (RD 244/2019, article 3.k and 4.1.a)"
    value: "an anti-export device that stops any export, meeting ITC-BT-40; e-distribución asks for the installation certificate of that device (makers' certificates cite UNE 217001)"
    check: { kind: none, why: "only for a self-consumption installation without export — a check on the installation, not on the model", source: "RD 244/2019 article 3.k, 4.1.a; ITC-BT-40; UNE 217001" }
  - id: storage
    rule: "Storage (TED/749/2020, additional provision 1, added 2026)"
    value: "a storage installation that exports follows the generation-module requirements in both directions until EU storage rules exist; it is exempt from presenting conformity certificates at the operational notification"
    check: { kind: document, provable_by: [document], applies: { classes: [battery, hybrid] }, changed_in: "2026-05", changed: "the storage provision was added by Orden TED/82/2026", source: "Orden TED/749/2020 additional provision 1" }
  - id: access-permit
    rule: "Access and connection permit line (RD 244/2019 article 7.1.b)"
    value: "self-consumption without export needs no access and connection permit; with export, none up to 15 kW on urbanised land; above that the grid operator's permit"
    check: { kind: max, meaning: procedure, field: ac_kw, limit: 15, over: "over 15 kW with export: an access and connection permit from the grid operator", provable_by: [datasheet, document], source: "RD 244/2019 article 7.1.b; e-distribución guide v12" }
  - id: under-frequency
    rule: "Reduction of maximum power with falling frequency (annex I, 1.4)"
    value: "the order allows a reduction only for synchronous gas-turbine and gas-engine modules and sets no allowance for power-park modules (inverters) — read as: hold power down to 47.5 Hz (GridFit's reading, not confirmed)"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 1.4" }
  - id: lfsm-u
    rule: "Under-frequency response, MRPFL-U (TED/749 annex I, 1.7)"
    value: "required only of types C and D (49.8 Hz, 5 %); storage follows the generation-module rules and is typed by its injection capacity, so home storage (type A) has none"
    check: { kind: none, why: "not required below type C", source: "Orden TED/749/2020 annex I, 1.7; additional provision 1 (Orden TED/82/2026)" }
  - id: power-factor
    rule: "Power factor in low voltage (RD 1699/2011 article 12.4; TED/749 2.3.2)"
    value: "as close to 1 as possible and above 0.98 when running above 25 % of rated power; TED/749 sets reactive capability only for types B–D; active power has priority within the normal voltage range (2.3.4)"
    check: { kind: document, provable_by: [document], source: "RD 1699/2011 article 12.4; Orden TED/749/2020 annex I, 2.3.2, 2.3.4" }
  - id: phase-jump
    rule: "Phase jumps and out-of-phase reclosure (annex I, 3.3.2)"
    value: "ride through phase jumps of up to 20° at the connection point without disconnecting; on a distribution network, survive an out-of-phase reclosure without damage (disconnection allowed)"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 3.3.2" }
  - id: overvoltage-emission
    rule: "Transient over-voltage emission, type A (annex I, 2.3.6, table 6)"
    value: "a type A power-park module creates no over-voltage between phases above 280 % of peak voltage for 0.2 ms, 218 % for 0.6 ms, 178 % for 2 ms, 145 % for 6 ms, 129 % for 20 ms and 120 % from 60 ms on"
    check: { kind: document, provable_by: [document], source: "Orden TED/749/2020 annex I, 2.3.6, table 6" }
  - id: non-peninsular
    rule: "Balearic, Canary, Ceuta and Melilla systems (TED/749 additional provision 2, added 2026)"
    value: "power-park modules from 0.8 kW to below 1 MW on the distribution networks of the non-peninsular systems follow operating procedure 12.2 (Resolution of 1 February 2018) for fault ride-through, power-electronics blocking, frequency ranges and RoCoF; certificates for this are not asked for nine months from application"
    check: { kind: document, provable_by: [document], changed_in: "2026-05", changed: "added by Orden TED/82/2026", source: "Orden TED/749/2020 additional provision 2" }
  - id: remote-control
    rule: "Remote set-points and information exchange (annex I, 1.6, 5.1)"
    value: "stopping or reducing a type A module's output follows the operating procedure on information exchange with the system operator; TED/749 itself puts no remote-control duty on a type A device"
    check: { kind: none, why: "no type A device requirement in the order", source: "Orden TED/749/2020 annex I, 1.6, 5.1" }
documents_for_listing:
  - "the maker's equipment certificate (certificado de equipo) for the inverter model, issued by an authorised certifier accredited under UNE-EN ISO/IEC 17065 (ENAC or an EA member), against RD 647/2020, Orden TED/749/2020 and the NTS — makers publish these per model family"
  - "the installation document (Documento de Instalación, RfG article 30) that the authorised installer files with the grid operator for the definitive operational notification; for a type A module in low voltage the installer, not a certifier, assembles it from the equipment certificates and the electrotechnical inspection (NTS 4.2.1)"
  - "the electrical installation certificate, CIE (certificado de instalación eléctrica de baja tensión), from the authorised installer; e-distribución accepts it as the proof of passed tests in low voltage"
  - "for self-consumption without export: the certificate of the installed anti-export device, unless stated on the CIE"
  - "a single-line diagram showing the metering, the installation's main data on the operator's form, and the holder's identity"
  - "where an access and connection permit was needed (over 15 kW with export, or not on urbanised land): the accepted technical and economic conditions and the technical access contract (CTA)"
apply:
  who: "the authorised installer (instalador autorizado) for low voltage, or the installation company in high voltage; the holder or a representative requests the self-consumption code"
  how: "ask the grid operator for the self-consumption code (CAU, 26 digits) on its web portal; file the installation with the regional authority (the community registers low-voltage installations under 100 kW ex officio, RD 244/2019 article 20); for installations that need an access and connection permit, the abbreviated procedure applies up to 15 kW and the general one above, with the operator's conditions due within three weeks up to 100 kW"
  guide_url: "https://www.edistribucion.com/content/dam/edistribucion/conexion-a-la-red/descargables/guia-autocosumo-ESPV12.pdf"
  guide_date: "e-distribución self-consumption guide, version 12 (PDF dated 2026-06-15); deadlines unchanged from v9"
  processing_time: "technical and economic conditions within 3 weeks up to 100 kW (half that in the abbreviated procedure); conditions valid 30 days; metering verification visit within 7 days"
not_listed: "There is no list to be on. A model is accepted when its equipment certificate covers the requirements above and the installer's installation document says so; a model without a certificate has no path except tests or simulations by an accredited entity (NTS 4.3, 4.4), which is not done for household inverters. Makers publish Spanish certificates per model family (RD 647 / TED 749 / NTS, UNE 217002, UNE 217001 for zero export); GridFit will show that document when it has read it."
thresholds:
  - "below 0.8 kW: outside RfG and RD 647/2020 (article 8.1 starts type A at 0.8 kW); plug-in units follow ITC-BT-40"
  - "type A: 0.8 kW to 100 kW below 110 kV (peninsular, article 8.1; the same figures below 66 kV in the non-peninsular systems); type B above 100 kW to 5 MW"
  - "self-consumption without export: no access and connection permit (RD 244/2019 article 7.1.b); with export up to 15 kW on urbanised land: no permit either; above that, a permit from the grid operator"
  - "compensation of surplus (compensación simplificada): renewable and up to 100 kW (article 4.2)"
  - "above 15 kW: three-phase connection (RD 1699/2011 article 12.2)"
  - "until 12 May 2026 self-consumption modules without export, and with export up to 15 kW, were exempt from RfG conformity (RD 647/2020 transitional provision 3); Orden TED/82/2026 ended that exemption"
commissioning: "Low voltage up to 100 kW: the installer's CIE (plus the regional filing receipt in some communities; Catalonia waives the CIE for generation when an A1 form is filed) and the metering check by the operator; above 100 kW or in high voltage: the administrative authorisation of commissioning (APM). The operator then issues, on request, the certificates needed for the production register under RD 413/2014."
changes:
  - "12 May 2026: Orden TED/82/2026 in force — fault ride-through for type A (figure 14), storage follows the generation-module rules in both directions, end of the self-consumption exemption, PO 12.2 rules for small modules in the non-peninsular systems"
  - "22 March 2026: Real Decreto-ley 7/2026 (BOE 2026-03-21) — collective self-consumption up to 5 km, the 'gestor de autoconsumo', 10 % of reserved capacity freed for self-consumption; administrative only, no inverter requirement"
  - "pending: a new self-consumption Royal Decree is announced and not adopted on 2026-11-01"
  - "the NTS (how conformity is proven) is still version 2.1 of July 2021; no edition with type A fault ride-through tests was found — how a certificate proves figure 14 for type A is open"
  - "2 February 2024: limited operational notifications without certificates ended (Orden TED/724/2022)"
evidence_for_documented: "The maker's Spanish equipment certificate for the exact model family: issued by an accredited certifier, naming RD 647/2020, Orden TED/749/2020 and the NTS version, plus UNE 217002 for the inverter and UNE 217001 where zero export is claimed. Certificates issued against NTS 2.0 stay valid per requirement under the equivalence table of NTS 2.1 (7.1.4.2). GridFit shows the document and its date; the grid operator decides at the operational notification."
