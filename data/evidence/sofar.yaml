    note: Type A. The register writes the same models with and without the "SOFAR" prefix and some with the product description glued
      on ("-GRIDCONNECTEDPHOTOVOLTAICINVERTER"); the regex takes those spellings. Garbled codes ("SOFAR3.3LKTLX-G3.-…", "SOFAR5KTLX-G3-A-3-…")
      are not taken.
