  copy_of: cdn.estg.eu (a distributor's CDN); SMA's own files.sma.de/downloads/EIFS_2_2018_Paraeinst-TI-en-12.pdf returned 404 on 2026-11-01
  issuer: SMA Solar Technology AG
  doc_no: EIFS_2_2018_Paraeinst-TI-en-12
