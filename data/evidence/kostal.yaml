# Evidence layer — see the rule below. URLs are the makers' own. Documents with an id in tools/evidence/sources.yaml
# are written by tools/evidence/build.py from the maker's file; the others were transcribed by hand. Do not edit the
# generated ones here: change the mapping in sources.yaml and rebuild.
brand: Kostal
maker_site: https://www.kostal-solar-electric.com/
rule: 'Facts transcribed from the maker''s own document on the seen date: a released-countries table (an X per family and country),
  the list of country / grid-code settings in the firmware, or a certificate / test-lab declaration against the named standard, with
  the models it lists. GridFit shows it as "fit by the maker''s document" in that country; the grid operator decides at the application,
  and where a country has a public list the list is the answer. Model codes are joined by `match`, a regex over the register code (upper
  case, spaces removed, comma read as a point).'
documents:
- id: released-countries-2026-10
  title: Freigegebene Länder / Released countries
  url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Listen/Released-countries-inverter.pdf
  kind: country-release
  note: 'Page 1: EU countries released for sale and use (X per family). Page 2 (Jordan, non-EU, via sales partners) is not read.'
  version: 10/2026
  doc_no: DOC01962673-041
  seen: '2026-11-01'
  source: tools/evidence
  families:
  - name: PLENTICORE G3
    match: ^PLENTICORE[SML]G3
    countries: [AT, BE, BG, CH, CY, DE, DK, EE, ES, FI, FR, GR, IT, LT, LU, LV, MT, NL, PL, PT, SE]
  - name: PLENTICORE MP G3
    match: ^PLENTICOREMP[SML]?G3
    countries: [AT, BE, BG, CH, DE, EE, ES, FR, GR, IT, LT, LU, LV, MT, NL, PL, PT, SE]
  - name: PLENTICORE BI G3
    match: ^PLENTICOREB[IL]\d+(\.\d+)?(/\d+)?G3$
    countries: [BE, BG, CH, CY, DE, EE, ES, FI, FR, GR, LT, LU, LV, MT, NL, PT, SE]
  - name: PLENTICORE plus / G2
    match: ^PLENTICOREPLUS(G2)?\d+(\.\d+)?(G2)?$
    countries: [AT, BE, CH, CY, DE, DK, EE, ES, FI, FR, GR, IT, LU, MT, NL, PL, PT, SE]
  - name: PLENTICORE BI / G2
    match: ^PLENTICOREB[IL](G2)?\d+(\.\d+)?(/\d+)?(G2)?$
    countries: [AT, BE, CH, DE, DK, ES, FI, FR, GR, IT, LU, NL, PL, PT, SE]
  - name: PIKO 10 – 20 (firmware 5.00 or later)
    match: ^PIKO(10|12|15|17|20)$
    note: released only from firmware 5.00 — check the firmware
    countries: [AT, BE, CH, CY, DE, DK, EE, ES, FI, FR, GR, IT, LU, MT, NL, PL, PT, SE]
  - name: PIKO CI 30/50/60
    match: ^PIKOC[IL](30|50|60)$
    countries: [AT, BE, CH, DE, DK, EE, ES, FI, FR, GR, IT, LU, NL, PL, PT, SE]
  - name: PIKO CI 30/50 G2
    match: ^PIKOC[IL](30|50)G2$
    countries: [AT, BE, BG, CH, DE, DK, ES, FI, FR, GR, IT, LT, LU, LV, NL, PL, SE]
  - name: PIKO CI 100
    match: ^PIKOC[IL]100$
    countries: [AT, BE, BG, CH, DE, DK, ES, FI, FR, GR, IT, LT, LU, LV, NL, PL, SE]
  - name: KSEM / KEM
    note: energy meters — no grid list carries them; not joined
    countries: [AT, BE, BG, CH, CY, DE, DK, EE, ES, FI, FR, GR, IT, LT, LU, LV, MT, NL, PL, PT, SE]
  - name: KOSTAL HELIVOR HV
    match: ^(KOSTAL)?HELIVOR
    countries: [AT, BE, CH, CY, DE, DK, EE, ES, FI, FR, GR, IT, LU, MT, NL, PL, PT, SE]
