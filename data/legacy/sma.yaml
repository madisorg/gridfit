# Legacy layer — facts transcribed from the maker's own pages on the seen date. Research notes of 2026-11-01.
# `match` is a regex over the register code normalised the way the specs layer does it (upper case, spaces removed).
brand: SMA
maker_site: https://www.sma.de
documents:
- id: sma-download-archive-2026-11
  title: "SMA Download Center — category 'Archive'"
  url: https://www.sma.de/en/service/downloads
  seen: "2026-11-01"
  kind: archive-page
  note: "The page states: \"Discontinued SMA products can be found in the category 'Archive'.\" The category itself is
    filled by script and could not be read over plain HTTP, so no model list is transcribed from it; the product pages
    below are what SMA says per product. SMA America's service portal describes the same category as the place for
    'all devices that are retired' (my.sma-service.com, Salesforce page, not readable without JavaScript)."
  models: []
- id: sma-sunny-boy-storage-37-50-60-2026-11
  title: "Sunny Boy Storage 3.7 / 5.0 / 6.0 (Successor: SMA Hybrid Inverters)"
  url: https://www.sma.de/en/products/battery-inverters/sunny-boy-storage-37-50-60
  seen: "2026-11-01"
  kind: eol-notice
  note: "Page text: \"SMA no longer sells the Sunny Boy Storage.\" Successor named in the page title: SMA Hybrid Inverters.
    The page prints the ratings 3.7 / 5.0 / 6.0 only; the type codes SBS3.7-10 / SBS5.0-10 / SBS6.0-10 are SMA's
    designations for exactly these three ratings, not printed on the page."
  models:
  - code: "Sunny Boy Storage 3.7 / 5.0 / 6.0"
    match: '^(SUNNYBOYSTORAGE)?(SBS)?(3\.7|5\.0|6\.0)-10$'
    note: "no longer sold; successor SMA Hybrid Inverters"
- id: sma-sunny-tripower-15000tl-20000tl-25000tl-2026-11
  title: "Sunny Tripower 15000TL / 20000TL / 25000TL (Successor: Sunny Tripower X)"
  url: https://www.sma.de/en/products/solarinverters/sunny-tripower-15000tl-20000tl-25000tl
  seen: "2026-11-01"
  kind: eol-notice
  note: "Page text: \"SMA will no longer sell the SMA Sunny Tripower 15000TL / 20000TL / 25000.\" and \"The Sunny Tripower X
    is the successor to the SMA Sunny Tripower 15000TL / 20000TL / 25000.\" The 17000TL is not named on the page and is
    deliberately not matched."
  models:
  - code: "Sunny Tripower 15000TL / 20000TL / 25000TL"
    match: '^(SUNNYTRIPOWER)?(STP)?(15000|20000|25000)TL-\d\d$'
    note: "no longer sold; successor Sunny Tripower X"
- id: sma-sunny-tripower-core1-2026-11
  title: "Sunny Tripower CORE1 (Successor: Sunny Tripower X 60)"
  url: https://www.sma.de/en/products/solarinverters/sunny-tripower-core1
  seen: "2026-11-01"
  kind: eol-notice
  note: "Page text: \"The Sunny Tripower CORE1 is no longer marketed by SMA.\" Successor: Sunny Tripower X 60. The page
    prints the product name and '50 kW' only; STP 50-40 / STP 50-41 are the CORE1 type codes (the manual link on the page
    carries 'STP5040')."
