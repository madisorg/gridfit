# Weekly: rebuild from the sources and commit the dataset. On the 1st of each month the grid
# registers are downloaded, parsed and diffed too (data/registers/); every week when the repository
# variable REGISTERS_WEEKLY is "true" (docs/freshness.md says what has to be settled first). Then the
# freshness watch (tools/watch/run.py) looks for new models at makers, in the lists, the integrations
# and the press, and writes docs/watch-report.md. Each push triggers the Cloudflare Pages build.
#
# Two things keep a passive site alive:
# - data/dataset/REFRESHED is rewritten on every run, so there is a commit every week even when no
#   source changed. GitHub disables scheduled workflows in a public repository after 60 days without
#   repository activity; the weekly commit is that activity.
# - The run pings a healthchecks.io check at the end (secret HEALTHCHECKS_URL = the check's ping URL,
#   period 7 days). No ping = an alert, also when the schedule silently stopped. Without the secret the
#   step is skipped and nothing else changes.
name: refresh
on:
  schedule:
    - cron: "17 4 * * 1"      # every Monday 04:17 UTC: sources
    - cron: "47 4 1 * *"      # 1st of the month 04:47 UTC: sources + grid registers
      # (not "1-7 * 1": in cron, day-of-month and day-of-week restricted together mean OR, not AND)
  workflow_dispatch:
    inputs:
      registers:
        description: "also refresh the grid registers"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: decide whether this run refreshes the registers
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "47 4 1 * *" ] || [ "${{ inputs.registers }}" = "true" ]              || [ "${{ vars.REGISTERS_WEEKLY }}" = "true" ]; then
            echo "registers=true" >> "$GITHUB_OUTPUT"
          else
            echo "registers=false" >> "$GITHUB_OUTPUT"
          fi
      - name: refresh sources (and registers on the monthly run)
        run: |
          if [ "${{ steps.mode.outputs.registers }}" = "true" ]; then
            python build.py --refresh --registers-refresh
          else
            python build.py --refresh
          fi
      - name: watch for new models (makers, lists, integrations, press)
        # a failing source or a failing watch must not stop the dataset refresh
        continue-on-error: true
        run: python tools/watch/run.py
      - name: keep the watch report as a run artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: watch-report
          path: |
            docs/watch-report.md
            data/watch/candidates.json
          if-no-files-found: ignore
          retention-days: 90
      - name: commit what changed, plus the weekly stamp
        run: |
          git config user.name "gridfit-bot"
          git config user.email "gridfit-bot@users.noreply.github.com"
          printf 'last refresh: %s\nregisters: %s\n' "$(date -u +%FT%TZ)" "${{ steps.mode.outputs.registers }}" > data/dataset/REFRESHED
          git add data/dataset data/registers
          git add data/watch docs/watch-report.md 2>/dev/null || true
          if [ "${{ steps.mode.outputs.registers }}" = "true" ]; then
            git commit -m "dataset: refresh $(date -u +%F) + grid registers"
          else
            git commit -m "dataset: refresh $(date -u +%F)"
          fi
          git push
      - name: healthchecks.io ping
        if: ${{ always() && env.HC != '' }}
        env:
          HC: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS -m 10 --retry 3 "$HC" > /dev/null
          else
            curl -fsS -m 10 --retry 3 "$HC/fail" > /dev/null
          fi
