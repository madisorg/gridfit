     checks: [[freq_bands, band_47_5_48_5_min, 30], [freq_bands, band_51_51_5_min, 30]]}
  - {id: rocof, item: rocof, label: "RoCoF withstand 2.0 Hz/s (500 ms window)", checks: [[rocof, immunity_hz_s, 2.0]]}
  - {id: lfsm-o, item: lfsm-o, label: "LFSM-O from 50.5 Hz, droop 8 % (25 % Pmax/Hz)", checks: [[lfsm_o, f1_hz, 50.5], [lfsm_o, droop_pct, 8]]}
  - {id: under-frequency, item: under-frequency, label: "Below 49 Hz output falls at most 3 % Pmax per Hz",
     checks: [[uf_power, reduction_pct_hz, [null, 3]]]}
  - {id: reconnection, item: reconnection, label: "Connect and reconnect within 47.5–50.1 Hz after 3 min; ramp ≤ 10 %/min in 49.9–50.1 Hz",
     checks: [[reconnect, f_low_hz, 47.5], [reconnect, f_high_hz, 50.1], [reconnect, observation_s, 180], [reconnect, ramp_pct_min, [null, 10]],
              [start, f_low_hz, 47.5], [start, f_high_hz, 50.1], [start, observation_s, 180]],
     note: "EIFS 2018:2 3 kap. 9 § lets the rise be unlimited below 49.9 Hz and forbids it above 50.1 Hz; only the 49.9–50.1 Hz ramp is a number here"}
  - {id: protection-voltage-high, item: lom-protection, label: "U> 253.0 V (1.10 Un) 60 s; U>> 264.5 V (1.15 Un) 0.2 s",
     checks: [[ov1, threshold_un, 1.10], [ov1, time_s, 60], [ov2, threshold_un, 1.15], [ov2, time_s, 0.2]],
     note: "older Swedish documents (Fronius 2020) carry 255.3 V (1.11 Un) for the 60 s stage; the forms number the two stages the other way round (Ellevio: 'steg 2' = 60 s)"}
  - {id: protection-voltage-low, item: lom-protection, label: "U< 195.5 V (0.85 Un) 0.2 s", checks: [[uv1, threshold_un, 0.85], [uv1, time_s, 0.2]]}
  - {id: protection-frequency, item: lom-protection, label: "f> 51.5 Hz 0.5 s; f< 47.5 Hz 0.5 s",
     checks: [[of1, threshold_hz, 51.5], [of1, time_s, 0.5], [uf1, threshold_hz, 47.5], [uf1, time_s, 0.5]]}
  - {id: anti-islanding, item: anti-islanding, label: "Unwanted island operation detected (RoCoF 2.5 Hz/s in 0.5 s)", checks: [[islanding, method, present]],
     note: "the 2.5 Hz/s / 0.5 s trip is a number the grammar has no parameter for"}
