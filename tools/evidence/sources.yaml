    url: https://www.sofarsolar.com/upload/file/20240321/1710982866939025487.pdf
    file: HYD-5-20KTL-3PH-manual-2024-03.pdf
    kind: grid-code-setting
    parser: codes
    args: {start: 'Setting the country code', end: 'Smartphone app', bare_codes: false}
    note: "The manual's country-code table (109-000 Estonia, 122-000 Latvia, 108-000 Lithuania, 125-000 Finland). The same code
      system as ZCS Azzurro's table; Sofar's other manuals sit in a JavaScript download centre and were not found elsewhere."
    families:
