rule: 'Every number is the maker''s own datasheet as read on the seen date: MPPT count, rated AC power (kW; kVA where the
  sheet gives apparent power), max AC output current (A), phases (from the AC connection row), max PV input (kW). A model
  code is matched to the lists exactly (upper case, spaces removed, comma as decimal point), or by `match` where the lists
  spell the same hardware differently. A value the sheet does not state is null and shows as ''not collected''. Hardware revisions
  with another suffix are other models.'
