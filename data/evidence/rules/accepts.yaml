# Which certified standard a country's grid operator names as the document for a model that is not on its list.
# tools/evidence/build.py reads it: a certificate family whose document's `standards` contains a `standard` below
# gets the country in `accepted_in` (derived, never in `countries`, which stays what the document itself names).
# One row per country, only from the operator's own words, quoted in data/profiles/<cc>.yaml. A country that is
# not here takes no generic certificate: Spain wants its own NTS / RD 647 / UNE 217002 certificates, Italy CEI 0-21,
# Germany VDE-AR-N 4105 — those name the country already. (This file is in a subdirectory so web/src/lib/evidence.ts,
# which reads every data/evidence/*.yaml as a brand, does not read it.)
- cc: EE
  standards: ['EN 50549-1', 'EN 50549-2', 'EN 50438']
  why: "Elektrilevi checks a 'certificate of compliance with RfG 2016/631 and/or EN 50549-1 (EN 50549-2 for medium voltage)' for
    a listed model, and the micro-producer form asks an EN 50438:2013 certificate and a type-test protocol for a model that is
    not on the list (data/profiles/ee.yaml: documents_for_listing, not_listed, evidence_for_documented)."
  source: https://www.elektrilevi.ee/-/doc/8644141/liitumised/vaiketootjale/failid/inverterite_lisamine_elektrilevi_nimekirja_est.pdf
