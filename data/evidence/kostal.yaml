      (see manual.md). First-generation PLENTICORE plus rows are joined by de-vde4105-eze-piko-iq-plenticore-plus-2020.
- id: de-vde4105-eze-piko-iq-plenticore-plus-2020
  title: Kiwa Primara 19-089-04 — Unit certificate VDE-AR-N 4105:2018-11 — PIKO IQ and PLENTICORE plus 3.0–10 (first generation)
  url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Zertifikate-Herstellererklaerungen/1602_Z-VDE-AR-N-4105-2018-Einheitenzertifikat_PIKO-IQ_PLENTI_en.pdf
  issuer: Kiwa Primara GmbH, Kaufbeuren
  cert_no: 19-089-04
  issued: '2020-09-16'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - VDE-AR-N 4105:2018-11
  - E DIN VDE V 0124-100 (VDE V 0124-100):((2019-04)) Arbeitsstand 27.03.2019
  families:
  - name: PIKO IQ 3.0–10 and PLENTICORE plus 3.0–10 (first generation)
    match: ^(PLENTICOREPLUS|PIKOIQ)(3\.0|4\.2|5\.5|7\.0|8\.5|10)$
