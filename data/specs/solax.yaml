  file: x3-hybrid-g4-datasheet-en.pdf
  version: V3.8
  note: the lists also write X3-Hybrid-5.0-M, X3-Hybrid-5.0-D/M, 'X3 Hybrid G4 5.0', 'Solax X3-Hybrid-5.0-D'
  seen: '2026-10-31'
