brand: HYXi POWER
maker_site: https://www.hyxipower.com/
rule: 'Every number is the maker''s own datasheet as read on the seen date: MPPT count, rated AC power (kW; kVA where the
  sheet gives apparent power), max AC output current (A), phases (from the AC connection row), max PV input (kW). A model
  code is matched to the lists exactly (upper case, spaces removed, comma as decimal point), or by `match` where the lists
  spell the same hardware differently. A value the sheet does not state is null and shows as ''not collected''. Hardware revisions
  with another suffix are other models. The optional grid-side fields (freq_hz, vac_v, vac_un, cosphi) are written only where
  the sheet states them.'
# Written by hand 2026-11-12 (Belgium's coverage pass, docs/coverage/be.md) from the datasheets linked on the product pages of
# www.hyxipower.com/en, each table read off the rendered page (the PDFs have no text tables). Current: the 230 V figure on
# single-phase sheets, the 400 V figure on three-phase ones. "-S" and "-SW" microinverters differ only in the radio (Sub-1G /
# Wi-Fi), as the sheet heads them in one column. The MS3000 sheets name the -BP-1 … -BP-5 battery-pack variants themselves.
# Not covered: the "-HS" hybrids (the sheet on the site is the "-HS1" revision — another suffix, another model) and the
# "-800" MS3000 variants (no sheet names them).
