  kind: certificate
  standards:
  - EN 50549-1:2019+A1:2023
  - EN 50549-10:2022
  cert_no: CN-PVES-260337
  issued: 31 August 2026
  seen: '2026-11-01'
  source: tools/evidence
  models_in_document:
  - MODA10KTL3-HU
  - MODA12KTL3-HU
  - MODA15KTL3-HU
  - MODA4000TL3-HU
  - MODA5000TL3-HU
  - MODA6000TL3-HU
  - MODA8000TL3-HU
