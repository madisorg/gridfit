- id: se-eifs-2018-2-parameters-v1.2
  title: SMA Technical Information "Parameter settings for compliance with EIFS 2018:2 for type A plants (only for Sweden)", version
    1.2
  url: https://cdn.estg.eu/p/9/b/0/4/9b040aa2d3326a91332342db6d17adf75e2a3640_EIFS_2_2018_Paraeinst_TI_en_12_only_for_Sweden.pdf
  copy_of: cdn.estg.eu (a distributor's CDN); SMA's own files.sma.de/downloads/EIFS_2_2018_Paraeinst-TI-en-12.pdf returned 404 on 2026-11-01
  issuer: SMA Solar Technology AG
  doc_no: EIFS_2_2018_Paraeinst-TI-en-12
  version: '1.2'
  issued: '2022-11-28'
  seen: '2026-11-01'
  kind: grid-code-setting
  standards:
  - EIFS 2018:2
  families:
  - name: Sunny Boy 1.5–2.5 (1VL-40) and 3.0–5.0 (1AV-41)
    match: ^(SUNNYBOY)?(SB)?((1\.5|2\.0|2\.5)-1VL-40|(3\.0|3\.6|4\.0|5\.0)-1AV-41)$
    countries: [SE]
  - name: Sunny Boy Storage 2.5 / 3.7–6.0
    match: ^((SUNNYBOYSTORAGE)?SBS2\.5-1VL-10|SBSTORAGE2\.5-1VL-10|(SUNNYBOYSTORAGE)?SBS(3\.7|5\.0|6\.0)-10)$
    countries: [SE]
  - name: Sunny Island 4.4M / 6.0H / 8.0H (-13)
    match: ^(SUNNYISLAND)?SI(4\.4M|6\.0H|8\.0H)-13$
    countries: [SE]
  - name: Sunny Tripower 3.0–10.0 (3AV-40), STP 50-40/-41, STP 12–25-50
    match: ^((SUNNYTRIPOWER)?(STP)?(3\.0|4\.0|5\.0|6\.0|8\.0|10\.0)-3AV-40|(SUNNYTRIPOWER|CORE1/)?STP50-4[01]|(SUNNYTRIPOWER)?(STP)?(12|15|20|25)-50)$
    countries: [SE]
    note: 'Maker''s parameter list, not a certificate: country data set [EU] EN50549-1:2018 LV, then default → value to set (HzOv 50.2
      → 50.5 Hz, gradient 40 → 25 %/Hz, reconnection times 60 → 180 s, hhLim 1.15 pu 200 ms, hLim 1.10 pu 60 000 ms, lLim 0.85 pu 200
      ms, connection 47.5–50.1 Hz, islanding trip 500 ms). The document prints no date; issued = the PDF''s creation date. The PDF keywords
      also list STP15000TL-30…25000TL-30, which the text does not — not joined.'
