    url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/2182_Z-Dichiarazione_di_conformita_CEI-0-21_G2_2024.pdf
    issuer: Bureau Veritas Consumer Products Services Germany GmbH (DAkkS D-ZE-12024-01-00; test lab D-PL-12024-03-04)
    cert_no: U24-0988
    issued: '2024-10-14'
    seen: '2026-10-31'
    kind: certificate
    standards:
    - CEI 0-21:2022-03
    - CEI 0-21;V1:2022-11
    firmware: SW ≥ 02.13
    families:
    - name: PLENTICORE plus 3.0/4.2/5.5/7.0/8.5/10 G2 (three-phase)
      match: '^PLENTICOREPLUS(3\.0|4\.2|5\.5|7\.0|8\.5|10)G2$'
      countries:
      - IT
      note: "Test report 19TH0374-G2-CEI 0-21_3; programme NSOP-0032-DEU-ZE-V10. The BV header names 2022-03/V1 only, but its body text says \"conforme ... CEI 0-21: 2022-03, V1: 2022-11, V2: 2024-01, Allegato A, Allegato B e Allegato Bbis\". \"Il dispositivo è per gli impianti di ogni potenza\". The SPI maker is KOSTAL Industrie Elektrik GmbH & Co.KG (Hagen); the SPI is integrated. Batteries are AXITEC AXIstorage Li SH and others."
