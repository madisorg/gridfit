  issuer: Sungrow Power Supply Co., Ltd. (maker's declaration)
  issued: '2021-01-22'
  seen: '2026-11-01'
  kind: declaration
  standards:
  - EN 50549-1
  - P4 PPDS 2018 (PŘÍLOHA 4 PPDS … 2018)
  families:
  - name: SG-S/SG-D/SG-KTL-M(T)/SH-RT/CX listed in the declaration
    match: ^(SG2K-S|SG2K5-S|SG3K-S|SG3K-D|SG3K6-D|SG4K-D|SG4K6-D|SG5K-D|SG6K-D|SG(5|6)KTL-MT|SG(8|10|12|15|17|20)KTL-M|SH(5\.0|6\.0|8\.0|10)RT|SG(33|40|50)CX|SG110CX)$
