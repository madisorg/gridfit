  title: DEKRA Certificate of Conformity 6211760.01COC — CEI 0-21:2022-03 + V1:2022-11 + V2:2024-01 — AF*-SL / SL-1 / SL-0 / SLP and
    AF*-ASL / ASL-1 / ASL-0 hybrid inverter
  url: https://www.aforenergy.com/wp-content/uploads/2025/04/【certificate】Italy-low-voltage-all-in-one-inverterLithium-Valley-battery.pdf
  issuer: DEKRA Testing and Certification (Shanghai) Ltd.
