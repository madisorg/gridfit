# Evidence layer — see the rule below. Research notes of 2026-10-31; URLs are the makers' own.
brand: ZCS Azzurro
maker_site: https://www.zcsazzurro.com/
rule: 'Facts transcribed from the maker''s own document on the seen date: a released-countries table (an X per family and country),
  or a certificate / test-lab declaration against the named national standard, with the models it lists. GridFit shows it as "fit by
  the maker''s document" in that country; the grid operator decides at the application, and where a country has a public list the list
  is the answer. Model codes are joined by `match`, a regex over the register code (upper case, spaces removed).'
documents:
- id: cei021-3ph-hyd-zp3-2025
  title: "Kiwa certificato 25-231-00 — CEI 0-21 2022-03; V1:2022-11; V2:2024-01 — AZZURRO 3PH HYD 5000…12000 ZP3"
  url: https://www.zcsazzurro.com/uploads/documetazione/certificazioni/Certificato-di-conformit%C3%A0-alla-norma-CEI-0-21-V.2022-03V1-2022-11-HYD-5000-12000-ZP3.pdf
  issuer: Kiwa Primara GmbH (DAkkS D-ZE-12089-01-00, DIN EN ISO/IEC 17065)
  cert_no: 25-231-00
  issued: '2025-07-17'
  seen: '2026-10-31'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  firmware: V000001
  families:
  - name: AZZURRO 3PH HYD 5000/6000/6500/8000/9900/10000/12000 ZP3 (three-phase hybrid 5–12 kW)
    match: '^(AZZURRO)?3PHHYD(5000|6000|6500|8000|9900|10000|12000)ZP3$'
    countries:
    - IT
    note: "SPI integrated; ticks \"idoneo per impianti > 11,08 kW\". Storage power depends on the module count (1, 3, 4–6 modules). The file name says V1 but the printed text includes V2:2024-01. A companion Dichiarazione is in the same folder."
- id: cei021-1ph-hyd-zss-hp-2026
  title: "Kiwa certificato 26-208-00 — CEI 0-21 (to V3:2025-10) — AZZURRO 1PH HYD3000…6000 ZSS HP"
  url: https://www.zcsazzurro.com/uploads/documetazione/certificazioni/Certificato-di-conformit%C3%A0-alla-norma-CEI-0-21-V.2022-03-HYD-3000-6000-ZSS-HP-5000S.pdf
  issuer: Kiwa Primara GmbH (DAkkS D-ZE-12089-01-00, DIN EN ISO/IEC 17065)
  cert_no: 26-208-00
  issued: '2026-08-04'
  seen: '2026-10-31'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  - CEI 0-21;V2/EC:2024-03
  - CEI 0-21;V2/EC2:2025-02
  - CEI 0-21;V3:2025-10
  firmware: V000001
  families:
  - name: AZZURRO 1PH HYD3000/3600/4000/4600/5000/5500/6000 ZSS HP (single-phase hybrid 3–6 kW)
    match: '^(AZZURRO)?1PHHYD(3000|3600|4000|4600|5000|5500|6000)ZSSHP$'
    countries:
    - IT
    note: "First V3:2025-10 certificate found. SPI integrated; ticks \"idoneo per impianti > 11,08 kW\". The 5500 is rated 5000 W. The batteries are from the file name's \"5000S\" series, and the converter reads the BMS to set PNINV/PMAXINV. It supersedes BV U23-0188 of 2023-01-09 (CEI 0-21:2022-03 only, FW V02000), which is still online as ...HYD-3000-6000-ZSS-HP.pdf."
