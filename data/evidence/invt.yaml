# Evidence layer — see the rule below. URLs are the makers' own. Documents with an id in tools/evidence/sources.yaml
# are written by tools/evidence/build.py from the maker's file; the others were transcribed by hand.
brand: INVT
maker_site: ''
rule: 'Facts transcribed from the maker''s own document on the seen date: a released-countries table (an X per family and country),
  the list of country / grid-code settings in the firmware, or a certificate / test-lab declaration against the named standard, with
  the models it lists. GridFit shows it as "fit by the maker''s document" in that country; the grid operator decides at the application,
  and where a country has a public list the list is the answer. Model codes are joined by `match`, a regex over the register code (upper
  case, spaces removed, comma read as a point).'
documents:
- id: es-nts-xg-3-15-2023
  title: Bureau Veritas U23-0761 — NTS:2021 (Rev. 2.1 + Corrección 1.0), Type A — iMars XG3…12KTR(-S), XG15KTR1(-S)
  url: https://www.invt.com/upload/download/2026-10/XG3-15KTR%20RD%26UNE%26NTS%20Certificate%28Spain%29.rar
  issuer: Bureau Veritas Consumer Products Services Germany GmbH
  cert_no: U23-0761
  issued: '2023-09-01'
  valid_until: '2028-08-31'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - NTS:2021 (Revisión 2.1 del 9 de julio de 2021)
  - Corrección de errores de la versión 2.1, Revisión 1.0 del 8 de octubre de 2021
  firmware: GAAA1.0
  families:
  - name: iMars XG-KTR three-phase string 3–15 kW
    match: ^(IMARS)?XG(3|4|5|6|8|9|10|11|12)KTR(-S)?$|^(IMARS)?XG15KTR1(-S)?$
    countries:
    - ES
    note: Report BSNK-ESH-P23040507-3. The URL is a RAR archive on invt.com (download centre, "XG3-15KTR RD&UNE&NTS Certificate(Spain)",
      posted 2026-10-15) holding four PDFs; this one is "NTS(INVT_iMars XG3KTR_UNBED_NTS_Type A_U23-0761_ESP).pdf". The same archive
      holds U23-0759 (UNE 217002:2020 + RD 647:2020, same models). The regex takes the register's "IMARSXG…" spelling; the -AU variants
      and "IMARSXG15KTR" (no "1") are not taken.
