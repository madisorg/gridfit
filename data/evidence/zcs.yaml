- id: cei021-3ph-hyd-zp3-2025
  title: Kiwa certificato 25-231-00 — CEI 0-21 2022-03; V1:2022-11; V2:2024-01 — AZZURRO 3PH HYD 5000…12000 ZP3
  url: https://www.zcsazzurro.com/uploads/documetazione/certificazioni/Certificato-di-conformit%C3%A0-alla-norma-CEI-0-21-V.2022-03V1-2022-11-HYD-5000-12000-ZP3.pdf
  issuer: Kiwa Primara GmbH (DAkkS D-ZE-12089-01-00, DIN EN ISO/IEC 17065)
  cert_no: 25-231-00
  issued: '2025-07-17'
  seen: '2026-10-31'
  kind: certificate
  standards:
  - CEI 0-21:2022-03
  - CEI 0-21;V1:2022-11
  - CEI 0-21;V2:2024-01
  firmware: V000001
  families:
  - name: AZZURRO 3PH HYD 5000/6000/6500/8000/9900/10000/12000 ZP3 (three-phase hybrid 5–12 kW)
    match: ^(AZZURRO)?3PHHYD(5000|6000|6500|8000|9900|10000|12000)ZP3$
    countries: [IT]
