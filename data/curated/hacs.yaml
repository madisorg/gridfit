# HACS (default store) custom integrations for energy devices, picked by hand from the
# HACS integration list. Stars, last update and description come from HACS's own data;
# iot_class (local/cloud) from the repo's manifest.json; settable-entity platforms are
# probed in the repo. This file says only what the repo is FOR:
#   repo:     owner/name on GitHub (must be in the HACS default list)
#   brands:   canonical brands (brands.yaml) the README names as supported
#   class:    inverter | hybrid | battery | wallbox | meter | plug-in
#   family:   what the README says it covers, in its own words (short)
#   conn:     modbus_tcp | modbus_rtu | http | mqtt | ble | udp | ocpp | cloud | other
#   families: optional - limit to these curated families (families.yaml) of the brand
#   note:     optional caveat shown on the row
# Generic protocol bridges (OCPP, SunSpec, BLE-BMS) and automations/optimisers are left out on purpose.

# --- inverters / hybrids ---
