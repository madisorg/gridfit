# Evidence layer: the maker's own document that says which countries a product family is released for.
# Facts only, transcribed from the document on the seen date; the grid operator decides at the application.
# `match` is a regex over the register model code normalised as the specs layer does it (upper case, spaces
# removed): it maps the document's family name to the lists' model codes. A family without `match` is not
# joined (meters, batteries the lists do not carry).
brand: Kostal
maker_site: https://www.kostal-solar-electric.com/
rule: 'The document is the maker''s own "Released countries" table: an X means the maker releases the family for that
  country and states that it fulfils the requirements there. GridFit shows that as "fit by the maker''s document";
  it is not a grid operator''s approval, and where the country has a public list the list is the answer.'
documents:
  - id: released-countries-2026-10
    title: "Freigegebene Länder / Released countries"
    url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Listen/Released-countries-inverter.pdf
    version: "10/2026"
    doc_no: DOC01962673-041
    seen: "2026-10-31"
    kind: country-release
    note: "Page 1: EU countries released for sale and use (X per family). Page 2 (Jordan, non-EU, via sales partners) is not transcribed. Column order as the document's header: PLENTICORE G3 · PLENTICORE MP G3 · PLENTICORE BI G3 · PLENTICORE plus / G2 · PLENTICORE BI / G2 · PIKO 10–20 > FW 5.00 · PIKO CI 30/50/60 · PIKO CI 30/50 G2 · PIKO CI 100 · KSEM / KEM · KOSTAL HELIVOR HV; read from the X positions with pdfplumber."
    families:
      - name: PLENTICORE G3
        match: '^PLENTICORE[SML]?G3\d'
        countries: [BG, BE, DK, DE, EE, FI, FR, GR, IT, LT, LU, LV, MT, NL, AT, PL, PT, SE, CH, ES, CY]
      - name: PLENTICORE MP G3
        match: '^PLENTICOREMPG3'
        countries: [BG, BE, DE, EE, FR, GR, IT, LT, LU, LV, MT, NL, AT, PL, PT, SE, CH, ES]
      - name: PLENTICORE BI G3
        match: '^PLENTICOREBI\d+(\.\d+)?G3$'
        countries: [BG, BE, DE, EE, FI, FR, GR, LT, LU, LV, MT, NL, PT, SE, CH, ES, CY]
      - name: PLENTICORE plus / G2
        match: '^PLENTICOREPLUS\d+(\.\d+)?(G2)?$'
        countries: [BE, DK, DE, EE, FI, FR, GR, IT, LU, MT, NL, AT, PL, PT, SE, CH, ES, CY]
      - name: PLENTICORE BI / G2
        match: '^PLENTICOREBI\d+(\.\d+)?(/\d+)?(G2)?$'
        countries: [BE, DK, DE, FI, FR, GR, IT, LU, NL, AT, PL, PT, SE, CH, ES]
      - name: "PIKO 10 – 20 (firmware 5.00 or later)"
        match: '^PIKO(10|12|15|17|20)$'
        note: "released only from firmware 5.00 — check the firmware"
        countries: [BE, DK, DE, EE, FI, FR, GR, IT, LU, MT, NL, AT, PL, PT, SE, CH, ES, CY]
      - name: PIKO CI 30/50/60
        match: '^PIKOCI(30|50|60)$'
        countries: [BE, DK, DE, EE, FI, FR, GR, IT, LU, NL, AT, PL, PT, SE, CH, ES]
      - name: PIKO CI 30/50 G2
        match: '^PIKOCI(30|50)G2$'
        countries: [BG, BE, DK, DE, FI, FR, GR, IT, LT, LU, LV, NL, AT, PL, SE, CH, ES]
      - name: PIKO CI 100
        match: '^PIKOCI100$'
        countries: [BG, BE, DK, DE, FI, FR, GR, IT, LT, LU, LV, NL, AT, PL, SE, CH, ES]
      - name: KSEM / KEM
        note: "energy meters — no grid list carries them; not joined"
        countries: [BG, BE, DK, DE, EE, FI, FR, GR, IT, LT, LU, LV, MT, NL, AT, PL, PT, SE, CH, ES, CY]
      - name: KOSTAL HELIVOR HV
        match: '^(KOSTAL)?HELIVOR'
        countries: [BE, DK, DE, EE, FI, FR, GR, IT, LU, MT, NL, AT, PL, PT, SE, CH, ES, CY]
  - id: cei021-plenticore-g3-2026
    title: "Dichiarazione di conformità + Kiwa certificato 25-222-03 — CEI 0-21 (to V2/EC2:2025-02) — PLENTICORE S/M/L G3 4.0…20.0 con sistemi a batteria"
    url: https://www.kostal-solar-electric.com/fileadmin/downloadcenter/kse/Zertifikate-Herstellererklaerungen/2301_Z_CEI_0-21_PLENTICORE_G3_it.pdf
    issuer: Kiwa Primara GmbH (DAkkS D-ZE-12089-01-00, DIN EN ISO/IEC 17065)
    cert_no: 25-222-03
    issued: '2026-05-07'
    seen: '2026-10-31'
    kind: certificate
    standards:
    - CEI 0-21:2022-03
    - CEI 0-21;V1:2022-11
    - CEI 0-21;V2:2024-01
    - CEI 0-21;V2/EC:2024-03
    - CEI 0-21;V2/EC2:2025-02
    firmware: SW ≥ 3.06.10 (inverter); BMS ≥ V01.26 (KOSTAL HELIVOR HV)
    families:
    - name: PLENTICORE S G3 4.0/5.5/7.0, M G3 8.5/10.0/12.5, L G3 15.0/17.5/20.0 (three-phase hybrid, power extension)
      match: '^PLENTICORE[SML]?G3\d'
      countries:
