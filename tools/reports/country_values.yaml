  - {id: anti-islanding, item: anti-islanding, label: "LoM by RoCoF 2.5 Hz/s within 0.5 s", checks: [[islanding, method, present]],
     note: "the RoCoF LoM threshold (2.5 Hz/s, tmax 0.5 s) has no parameter in the grammar; only presence is compared"}
  - {id: reconnection, item: reconnection, label: "Reconnect within 49.00–50.05 Hz after 60 s, ramp ≤ 10 %/min",
     checks: [[reconnect, f_low_hz, 49.0], [reconnect, f_high_hz, 50.05], [reconnect, observation_s, 60], [reconnect, ramp_pct_min, [null, 10]],
              [start, f_low_hz, 49.0], [start, f_high_hz, 50.05], [start, observation_s, 60]],
     note: "Dz.U. 2023 poz. 1098 (micro-installations) gives 47.5–50.1 Hz, 0.85–1.10 Un, 60 s observation + 60 s delay; WOS 2025 / Bank Nastaw's narrower 49.00–50.05 Hz window is used here"}
  - {id: p-of-u, item: p-of-u, label: "P(U) from 1.08 pu", checks: [[p_u, start_un, 1.08]]}
  - {id: reactive, item: reactive, label: "cos φ 0.9 ind – 0.9 cap; Q(U) as Bank Nastaw's default",
     checks: [[cosphi, min_cosphi, 0.9], [q_modes, modes, {modes: [q_u, cosphi_p]}]],
     note: "q_u from Bank Nastaw 1.1; cosphi_p read from the micro regulation's 'curve set by the OSD' between cos φ 0.9 ind and 0.9 cap above 20 % P — the regulation does not name the mode"}
SE:
  profile: data/profiles/se.yaml
