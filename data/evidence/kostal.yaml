  - CEI 0-21;V2:2024-01
  - CEI 0-21;V2/EC:2024-03
  - CEI 0-21;V2/EC2:2025-02
  firmware: SW ≥ 3.06.10 (inverter); BMS ≥ V01.26 (KOSTAL HELIVOR HV)
  families:
  - name: PLENTICORE S G3 4.0/5.5/7.0, M G3 8.5/10.0/12.5, L G3 15.0/17.5/20.0 (three-phase hybrid, power extension)
