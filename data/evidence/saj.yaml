- id: es-nts-hs3-s2-2024
  title: TÜV Rheinland A3 50655633 0001 — NTS 2.1 + Corrección 1.0, UNE 217001 — HS3-3…6K-S2 (W/G, BX/PX)
  url: https://www.saj-electric.com/hubfs/South%20East%20Europe%20document/Certification/Spain%20certification/HS3/HS3-(3-6K)-S2%20Series%20Single-phase%20NTS2.1%20and%20UNE217001%20Certificate-ES.pdf
  issuer: TÜV Rheinland LGA Products GmbH
  cert_no: A3 50655633 0001
  issued: '2024-12-05'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - NTS Version 2.1
  - NTS Version 2.1-Correction 1.0
  - UNE 217001:2020
  firmware: 'DSP: V1.100, MCU: V1.010'
  families:
  - name: HS3-S2 single-phase all-in-one storage 3–6 kW
    match: ^HS3-(3|3\.6|4|4\.6|5|6)K-S2-[WG]-[BP]X$|^HS3-5K-S2-[WG]-[BP]X-BE$|^HS3-6K-S2-[WG]-[BP]X-IE$
    countries:
    - ES
    note: Report CN24LQEI 001. X = number of battery modules 1–8. A companion TÜV certificate AK 50655636 0001 (2024-12-04, RD 1699/661/647/244/413
      + UNE 217002:2020, report CN24A77R 001) lists the same 32 models (it prints one as "HS3-5K-S2-PX-BE", a typo for W-PX-BE).
- id: es-rd647-hs3-t2-2024
  title: TÜV Rheinland AK 50654501 0001 — RD 647/2020, RD 413/2014, UNE 217002:2020 — HS3-3…12K-T2 (W/G, BX/PX)
  url: https://www.saj-electric.com/hubfs/South%20East%20Europe%20document/Certification/Spain%20certification/HS3/HS3-(3-12K)-T2%20Series%20Three-phase%20UNE%20and%20RD%20Certificate-ES.pdf
  issuer: TÜV Rheinland LGA Products GmbH
  cert_no: AK 50654501 0001
  issued: '2024-12-09'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - RD 1699:2011
  - RD 661:2007
  - RD 647:2020
  - RD 413:2014
  - RD 244:2019
  - UNE 217002:2020
  - UNE 206006 IN:2011
  - UNE 206007-1 IN:2013
  firmware: V1.011 (Main DSP V1.010 (U3), Slave MCU V2.010 (U4), BMS V1.407)
  families:
  - name: HS3-T2 three-phase all-in-one storage 3–12 kW
    match: ^HS3-(3|4|5|6|8|10|12)K-T2-[WG]-[BP]X$|^HS3-10K-T2-[WG]-[BP]X-BE$|^HS3-12K-T2-[WG]-[BP]X-IE$|^HS3-(3|4|5|6|8|10|12)K-T2-W-[BP]X(-BE|-IE)?;HS3-(3|4|5|6|8|10|12)K-T2-G-[BP]X(-BE|-IE)?\(X=1\.2\.3\.4\.5\.6\.7\.8\)$
    countries:
    - ES
    note: Report CN242KF1 001. X = number of battery modules 1–8. The register also carries each W/G pair as one combined battery-class
      entry "HS3-…-W-BX;HS3-…-G-BX(X=1.2…8)"; both members are listed, so the regex takes those 18 too. The certificate prints "HS3-6KT2-W-BX"
      and "HS3-4KT2-W-BX" without the hyphen. The NTS 2.1 + UNE 217001 certificate A3 50655356 0001 (2024-12-09, report CN240ZB7 001,
      FW V1.011) covers only 5–12 kW of this list (no 3K/4K).
- id: es-nts-hs2-as2-2025
  title: TÜV Rheinland A3 50687772 0001 — NTS 2.1, UNE 217001, UNE 206007-1 — HS2-5…10K-T2(-B)-X (incl. WiFi), AS2-5…10K-T(-B)-X
  url: https://www.saj-electric.com/hubfs/South%20East%20Europe%20document/Certification/Spain%20certification/HS2%20AS2/HS2%2cAS2-(3-12)K-T2%20(WIFI%20)%20NTS%20%26%20UNE217001%20Certificate-ES.pdf
  issuer: TÜV Rheinland LGA Products GmbH
  cert_no: A3 50687772 0001
  issued: '2025-07-29'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - UNE 206007-1 IN:2013
  - UNE 217001:2020
  - NTS Version 2.1
  - NTS Version 2.1-Correction 1.0
  firmware: V1.012
  families:
  - name: HS2-T2 / AS2-T three-phase all-in-one storage 5–10 kW
    match: ^(HS2-(5|6|8|10)K-T2|HS2-10K-T2-B)(-[1-5X])?(WIFI)?(\(X=2\.3\.4\.5\))?$|^(AS2-(5|6|8|10)K-T|AS2-10K-T-B)(-[1-5X])?(\(X=2\.3\.4\.5\))?$
    countries:
    - ES
    note: Report CN22F7HE 002. The certificate lists HS2-5/6/8/10K-T2-X, HS2-10K-T2-B-X, AS2-5/6/8/10K-T-X, AS2-10K-T-B-X and the HS2
      "-X WiFi" variants, X = number of modules 1–5. The regex also takes the register's bare codes without the module count (HS2-5K-T2,
      AS2-5K-T, AS2-10K-T-B …; AS2 bare codes are battery class in the register) as the same hardware — drop them if that is too generous.
      Supersedes A3 50567654 0001 (2022-12-08, no WiFi variants). Companion RD certificate AK 50687778 0001 (2025-07-29, RD 1699/661/413/647/244
      + UNE 217002:2020, report CN22GZ3B 002) lists the same models.
