  cert_no: ESY 064946 0030 Rev. 00
  issued: '2025-10-22'
  seen: '2026-11-12'
  kind: certificate
  standards:
  - CEI 0-21:2022/V2:2024
  firmware: 'AC-DSP1: V1.17 (4FD4) and higher'
